services:
  app:
    build: .
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      APP_ENV: local-container
      COMMIT_SHA: local
      ENABLE_DRILLS: "true"
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    cpus: 0.5
    stop_grace_period: 20s
